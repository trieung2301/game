name: server-ci

on:
  push:
    paths: ["server/**", "proto/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", "proto/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + test
        run: mvn -B -f server/pom.xml verify
