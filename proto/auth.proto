syntax = "proto3";

package linhdienky;

option java_package = "com.linhdienky.protocol";
option java_multiple_files = true;
option csharp_namespace = "LinhDienKy.Protocol";

// Client gửi JWT (lấy từ api-server) khi vừa kết nối TCP tới game-server
message LoginRequest {
  string token = 1;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  int64 character_id = 3;
}
