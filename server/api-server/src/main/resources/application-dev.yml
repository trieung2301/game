spring:
  output:
    ansi:
      enabled: always   # bật màu log trong terminal VS Code
  datasource:
    url: jdbc:postgresql://localhost:5432/linhdienky
    username: ldk
    password: ldk_dev_password
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ldk
    password: ldk_dev_password

app:
  jwt:
    # Chỉ dùng cho môi trường dev. Prod lấy từ biến môi trường.
    secret: dev-secret-key-doi-sau-it-nhat-32-ky-tu-1234567890
    access-token-minutes: 30
    refresh-token-days: 7

# Log gọn cho dev: giờ | mức | class | nội dung
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(%-25.25logger{0}){cyan} %m%n%wEx"
  level:
    root: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG     # in câu SQL Hibernate chạy
