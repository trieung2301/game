server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: api-server
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Bảng chỉ được tạo/sửa qua Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
